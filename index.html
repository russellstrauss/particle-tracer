<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flow Fields</title>
	<link rel="stylesheet" href="/src/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;600&display=swap"
		rel="stylesheet">
</head>

<body>
	<div id="app">
		<canvas id="canvas"></canvas>
		<div id="overlay">
			<div id="title">
				<h1>Flow Fields</h1>
				<p id="message" class="subtitle"></p>
			</div>
		</div>
		<div id="legend">
			<span class="legend-title">Controls</span>
			<div class="backdrop">
				<table>
					<thead>
						<tr class="divider">
							<td>Function</td>
							<td>Key</td>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>Reset</td>
							<td><span class="key">R</span></td>
						</tr>
						<tr>
							<td>Fire burst</td>
							<td><span class="key">B</span></td>
						</tr>
						<tr>
							<td>Toggle trails</td>
							<td><span class="key">T</span></td>
						</tr>
						<tr>
							<td>Toggle emitter</td>
							<td><span class="key">E</span></td>
						</tr>
						<tr>
							<td>Probe (Probe mode)</td>
							<td><span class="key">left click</span></td>
						</tr>
						<tr>
							<td>Cursor force</td>
							<td><span class="key">right-drag</span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
